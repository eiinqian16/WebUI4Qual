<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Restore Config</title>
  <link rel="stylesheet" href="css/system.css">
</head>

<body>
  <div class="box">
    <h1 data-i18n="syslog.title">System Log</h1>
    <p class="description" data-i18n="syslog.desc">View recorded system activities</p>
    <hr>
    <div id="date"></div>
    <div class="system-log-actions">
      <input type="text" id="search" placeholder="Search logs..." data-i18n-placeholder="syslog.search_placeholder">
      <button onclick="searchLog()" data-i18n="common.search">Search</button>
      <button class="log-refresh-btn" onclick="refreshLog()" data-i18n="common.refresh">Refresh</button>
    </div>
    <span id="loading-spinner" class="loading-spinner hidden"></span>
    <br>
    <br>
    <span id="resultCount"></span>
    <span id="nextButton"></span>
    <span id="prevButton"></span>
    <br>
    <br>
    <div>
      <pre id="logBox" readonly></pre>
    </div>
  </div>
  <div class="box">
    <h1 data-i18n="syslog.download_title">Download Log</h1>
    <p class="description" data-i18n="syslog.download_desc">Download full recorded activities to local PC</p>
    <hr>
    <button id="dlSyslog" onclick="downloadLog()" data-i18n="syslog.download_title">Download Log</button>
  </div>
</body>

</html>
